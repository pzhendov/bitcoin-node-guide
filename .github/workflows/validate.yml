name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    name: Bash, systemd, and security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          for script in scripts/*.sh; do
            echo "Checking Bash syntax: ${script}"
            bash -n "${script}"
          done

      - name: Install ShellCheck when needed
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

          shellcheck --version

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck scripts/*.sh

      - name: Validate systemd units
        shell: bash
        run: |
          set -euo pipefail

          if ! id ubuntu >/dev/null 2>&1; then
            sudo useradd \
              --system \
              --create-home \
              --shell /usr/sbin/nologin \
              ubuntu
          fi

          sudo install -o root -g root -m 0755 \
            scripts/bitcoin-node-clock-recovery.sh \
            /usr/local/bin/bitcoin-node-clock-recovery

          sudo install -o root -g root -m 0755 \
            scripts/bitcoin-node-health.sh \
            /usr/local/bin/bitcoin-node-health

          sudo install -o root -g root -m 0755 \
            scripts/bitcoin-node-health-runner.sh \
            /usr/local/bin/bitcoin-node-health-runner

          sudo install -o root -g root -m 0755 \
            scripts/bitcoin-node-telegram-alert.sh \
            /usr/local/bin/bitcoin-node-telegram-alert

          sudo systemd-analyze verify \
            systemd/bitcoin-node-clock-recovery.service \
            systemd/bitcoin-node-clock-recovery.timer \
            systemd/bitcoin-node-health.service \
            systemd/bitcoin-node-health.timer

      - name: Reject credential files
        shell: bash
        run: |
          set -euo pipefail

          secret_files="$(
            find . \
              -path './.git' -prune -o \
              -type f \
              \( -name '*.env' -o -name 'telegram.env' \) \
              -print
          )"

          if [[ -n "${secret_files}" ]]; then
            echo "Credential files must not be committed:"
            printf '%s\n' "${secret_files}"
            exit 1
          fi

      - name: Scan for Telegram bot tokens
        shell: bash
        run: |
          set -euo pipefail

          if grep \
            --recursive \
            --line-number \
            --extended-regexp \
            --exclude-dir=.git \
            '[0-9]{6,12}:[A-Za-z0-9_-]{30,}' \
            .
          then
            echo "Possible Telegram bot token detected."
            exit 1
          fi

      - name: Reject committed Sparrow RPC secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            find . \
              -path './.git' -prune -o \
              -type f \
              \( \
                -name 'sparrow-rpc.conf' -o \
                -name 'sparrow-rpc-credentials.txt' -o \
                -name '*rpc-credentials.txt' \
              \) \
              -print
          )"

          if [[ -n "$forbidden_files" ]]; then
            echo "Live Sparrow RPC files must not be committed:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          if grep \
            --recursive \
            --line-number \
            --extended-regexp \
            --exclude-dir=.git \
            'rpcauth=[A-Za-z0-9_-]+:[0-9a-fA-F]{16,}\$[0-9a-fA-F]{32,}' \
            .
          then
            echo "Possible live Bitcoin Core rpcauth hash detected."
            exit 1
          fi

      - name: Test Sparrow RPC setup safety barriers
        shell: bash
        run: |
          set -euo pipefail

          set +e
          BITCOIN_CLI=/bin/true \
          SS=/bin/true \
            scripts/bitcoin-node-sparrow-rpc-setup.sh \
              --install \
              --server-ip 192.168.252.3 \
              --client-ip 192.168.252.1 \
              --rpcauth-tool /tmp/not-used
          unconfirmed_status=$?

          BITCOIN_CLI=/bin/true \
          SS=/bin/true \
            scripts/bitcoin-node-sparrow-rpc-setup.sh \
              --install \
              --confirm-sparrow-rpc \
              --server-ip 0.0.0.0 \
              --client-ip 192.168.252.1 \
              --rpcauth-tool /tmp/not-used
          wildcard_status=$?
          set -e

          [[ "$unconfirmed_status" == "1" ]]
          [[ "$wildcard_status" == "1" ]]

          grep -q 'Never prints the generated RPC password' \
            scripts/bitcoin-node-sparrow-rpc-setup.sh

          grep -Fq 'rpcallowip=${CLIENT_IP}/32' \
            scripts/bitcoin-node-sparrow-rpc-setup.sh

          if grep -q 'rpcbind=0.0.0.0' \
            scripts/bitcoin-node-sparrow-rpc-setup.sh
          then
            echo "Unsafe wildcard RPC bind detected in setup script."
            exit 1
          fi

      - name: Reject trailing whitespace
        shell: bash
        run: |
          set -euo pipefail

          if git grep \
            --line-number \
            --extended-regexp \
            '[[:blank:]]+$' \
            -- \
            '*.md' \
            '*.sh' \
            '*.service' \
            '*.timer' \
            '*.plist' \
            '*.yml'
          then
            echo "Trailing whitespace detected."
            exit 1
          fi

  macos-validation:
    name: macOS LaunchAgent
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate macOS script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/macos-bitcoin-node-backup-audit.sh
          bash -n scripts/macos-bitcoin-node-backup-deep-audit.sh
          bash -n scripts/macos-bitcoin-node-backup-deep-notify.sh
          bash -n scripts/macos-bitcoin-node-backup-notify.sh
          bash -n scripts/macos-bitcoin-node-backup-replicate.sh
          bash -n scripts/macos-bitcoin-node-backup-retention.sh
          bash -n scripts/macos-bitcoin-node-backup.sh
          bash -n scripts/macos-bitcoin-node-notify.sh

      - name: Test backup retention safety
        shell: bash
        run: |
          set -euo pipefail

          retention_directory="$(
            mktemp -d "${TMPDIR:-/tmp}/bitcoin-retention-ci.XXXXXX"
          )"

          unexpected_directory="$(
            mktemp -d "${TMPDIR:-/tmp}/bitcoin-retention-unexpected-ci.XXXXXX"
          )"

          cleanup() {
            rm -rf -- \
              "$retention_directory" \
              "$unexpected_directory"
          }

          trap cleanup EXIT

          create_fixture() {
            local block_height="$1"
            local backup_date="$2"
            local backup_stem="bitcoin-node-pruned-${block_height}-${backup_date}"
            local archive_path="${retention_directory}/${backup_stem}.tar.zst"

            printf 'test backup for block %s\n' "$block_height" \
              > "$archive_path"

            shasum -a 256 "$archive_path" \
              > "${archive_path}.sha256"

            printf 'block=%s\ndate=%s\n' \
              "$block_height" \
              "$backup_date" \
              > "${retention_directory}/${backup_stem}.manifest.txt"
          }

          create_fixture 100 2026-08-01
          create_fixture 200 2026-08-02
          create_fixture 300 2026-08-03

          dry_run_output="$(
            scripts/macos-bitcoin-node-backup-retention.sh \
              --dry-run \
              --keep 2 \
              --destination "$retention_directory"
          )"

          printf '%s\n' "$dry_run_output"

          grep -q 'PROTECT: block=300' <<< "$dry_run_output"
          grep -q 'PROTECT: block=200' <<< "$dry_run_output"
          grep -q 'CANDIDATE: block=100' <<< "$dry_run_output"
          grep -q 'complete=3 protected=2 candidates=1' <<< "$dry_run_output"

          fixture_count="$(
            find "$retention_directory" -type f |
              wc -l |
              tr -d ' '
          )"

          [[ "$fixture_count" == "9" ]]

          scripts/macos-bitcoin-node-backup-retention.sh \
            --execute \
            --confirm-retention-delete \
            --keep 2 \
            --destination "$retention_directory"

          [[ ! -e "$retention_directory/bitcoin-node-pruned-100-2026-08-01.tar.zst" ]]
          [[ -e "$retention_directory/bitcoin-node-pruned-200-2026-08-02.tar.zst" ]]
          [[ -e "$retention_directory/bitcoin-node-pruned-300-2026-08-03.tar.zst" ]]

          fixture_count="$(
            find "$retention_directory" -type f |
              wc -l |
              tr -d ' '
          )"

          [[ "$fixture_count" == "6" ]]

          create_fixture 100 2026-08-01

          printf 'intentional corruption\n' \
            >> "$retention_directory/bitcoin-node-pruned-100-2026-08-01.tar.zst"

          set +e
          corrupt_output="$(
            scripts/macos-bitcoin-node-backup-retention.sh \
              --execute \
              --confirm-retention-delete \
              --keep 2 \
              --destination "$retention_directory" \
              2>&1
          )"
          corrupt_status=$?
          set -e

          printf '%s\n' "$corrupt_output"

          [[ "$corrupt_status" == "2" ]]
          grep -q 'Archive checksum verification failed' <<< "$corrupt_output"

          unexpected_archive="$unexpected_directory/bitcoin-node-pruned-unexpected.tar.zst"

          printf 'unexpected fixture\n' > "$unexpected_archive"
          shasum -a 256 "$unexpected_archive" > "${unexpected_archive}.sha256"
          printf 'unexpected=true\n' \
            > "$unexpected_directory/bitcoin-node-pruned-unexpected.manifest.txt"

          set +e
          unexpected_output="$(
            scripts/macos-bitcoin-node-backup-retention.sh \
              --dry-run \
              --keep 2 \
              --destination "$unexpected_directory" \
              2>&1
          )"
          unexpected_status=$?
          set -e

          printf '%s\n' "$unexpected_output"

          [[ "$unexpected_status" == "2" ]]
          grep -q 'Unexpected archive names require manual inspection' \
            <<< "$unexpected_output"

          set +e
          scripts/macos-bitcoin-node-backup-retention.sh \
            --execute \
            --keep 2 \
            --destination "$retention_directory"
          unconfirmed_status=$?

          scripts/macos-bitcoin-node-backup-retention.sh \
            --dry-run \
            --keep 1 \
            --destination "$retention_directory"
          unsafe_keep_status=$?
          set -e

          [[ "$unconfirmed_status" == "1" ]]
          [[ "$unsafe_keep_status" == "1" ]]

      - name: Test external backup replication safety
        shell: bash
        run: |
          set -euo pipefail

          replication_root="$(
            mktemp -d "${TMPDIR:-/tmp}/bitcoin-replication-ci.XXXXXX"
          )"

          local_directory="${replication_root}/local"
          external_directory="${replication_root}/external"

          mkdir -p "$local_directory" "$external_directory"

          cleanup() {
            rm -rf -- "$replication_root"
          }

          trap cleanup EXIT

          create_fixture() {
            local block_height="$1"
            local backup_date="$2"
            local backup_stem="bitcoin-node-pruned-${block_height}-${backup_date}"
            local archive_path="${local_directory}/${backup_stem}.tar.zst"
            local archive_sha

            printf 'replication fixture for block %s\n' "$block_height" \
              > "$archive_path"

            archive_sha="$(
              shasum -a 256 "$archive_path" |
                awk '{ print $1 }'
            )"

            printf '%s  %s\n' \
              "$archive_sha" \
              "${backup_stem}.tar.zst" \
              > "${archive_path}.sha256"

            printf 'block=%s\ndate=%s\n' \
              "$block_height" \
              "$backup_date" \
              > "${local_directory}/${backup_stem}.manifest.txt"
          }

          create_fixture 100 2026-08-01
          create_fixture 200 2026-08-02

          dry_run_output="$(
            REPLICATION_ALLOW_NON_VOLUME_DESTINATION=true \
              scripts/macos-bitcoin-node-backup-replicate.sh \
              --dry-run \
              --source "$local_directory" \
              --destination "$external_directory"
          )"

          printf '%s\n' "$dry_run_output"
          grep -q 'Newest local backup verified: block=200' \
            <<< "$dry_run_output"
          grep -q 'Dry-run completed; no files were created or modified' \
            <<< "$dry_run_output"
          [[ "$(find "$external_directory" -type f | wc -l | tr -d ' ')" == "0" ]]

          set +e
          REPLICATION_ALLOW_NON_VOLUME_DESTINATION=true \
            scripts/macos-bitcoin-node-backup-replicate.sh \
            --execute \
            --source "$local_directory" \
            --destination "$external_directory"
          unconfirmed_status=$?
          set -e

          [[ "$unconfirmed_status" == "1" ]]

          execute_output="$(
            REPLICATION_ALLOW_NON_VOLUME_DESTINATION=true \
              scripts/macos-bitcoin-node-backup-replicate.sh \
              --execute \
              --confirm-external-replication \
              --source "$local_directory" \
              --destination "$external_directory"
          )"

          printf '%s\n' "$execute_output"
          grep -q 'External replication completed successfully' \
            <<< "$execute_output"

          newest_stem="bitcoin-node-pruned-200-2026-08-02"

          for expected_path in \
            "${external_directory}/${newest_stem}.tar.zst" \
            "${external_directory}/${newest_stem}.tar.zst.sha256" \
            "${external_directory}/${newest_stem}.manifest.txt"
          do
            [[ -f "$expected_path" ]]
          done

          [[ "$(find "$external_directory" -type f -name '*.partial' | wc -l | tr -d ' ')" == "0" ]]

          repeat_output="$(
            REPLICATION_ALLOW_NON_VOLUME_DESTINATION=true \
              scripts/macos-bitcoin-node-backup-replicate.sh \
              --execute \
              --confirm-external-replication \
              --source "$local_directory" \
              --destination "$external_directory"
          )"

          printf '%s\n' "$repeat_output"
          grep -q 'External backup is already synchronized and verified' \
            <<< "$repeat_output"

          partial_directory="${replication_root}/partial"
          mkdir -p "$partial_directory"
          touch "${partial_directory}/${newest_stem}.tar.zst.partial"

          set +e
          partial_output="$(
            REPLICATION_ALLOW_NON_VOLUME_DESTINATION=true \
              scripts/macos-bitcoin-node-backup-replicate.sh \
              --dry-run \
              --source "$local_directory" \
              --destination "$partial_directory" \
              2>&1
          )"
          partial_status=$?
          set -e

          printf '%s\n' "$partial_output"
          [[ "$partial_status" == "2" ]]
          grep -q 'Incomplete external artifacts require manual inspection' \
            <<< "$partial_output"
          [[ -f "${partial_directory}/${newest_stem}.tar.zst.partial" ]]

      - name: Test deep backup integrity audit
        shell: bash
        run: |
          set -euo pipefail

          deep_directory="$(
            mktemp -d "${TMPDIR:-/tmp}/bitcoin-deep-audit-ci.XXXXXX"
          )"
          backup_directory="${deep_directory}/backups"
          receipt_directory="${deep_directory}/receipts"
          external_directory="${deep_directory}/unmounted/bitcoin-node-backups"

          cleanup() {
            rm -rf "$deep_directory"
          }
          trap cleanup EXIT

          mkdir -p "$backup_directory"

          today="$(date -u '+%Y-%m-%d')"
          yesterday="$(date -u -v-1d '+%Y-%m-%d')"

          for specification in \
            "300:${today}" \
            "200:${yesterday}"
          do
            block_height="${specification%%:*}"
            backup_date="${specification#*:}"
            backup_base="bitcoin-node-pruned-${block_height}-${backup_date}"
            archive_path="${backup_directory}/${backup_base}.tar.zst"

            printf 'validated test blockchain data: %s\n' "$backup_base" |
              zstd -q -o "$archive_path"

            (
              cd "$backup_directory"
              shasum -a 256 "${backup_base}.tar.zst" \
                >"${backup_base}.tar.zst.sha256"
            )

            printf 'block_height=%s\nbackup_date=%s\n' \
              "$block_height" \
              "$backup_date" \
              >"${backup_directory}/${backup_base}.manifest.txt"

            chmod 600 \
              "$archive_path" \
              "${archive_path}.sha256" \
              "${backup_directory}/${backup_base}.manifest.txt"
          done

          healthy_output="$(
            scripts/macos-bitcoin-node-backup-deep-audit.sh \
              --local-directory "$backup_directory" \
              --external-directory "$external_directory" \
              --receipt-directory "$receipt_directory"
          )"

          printf '%s\n' "$healthy_output"
          grep -q '\[SUMMARY\] status=HEALTHY' <<<"$healthy_output"
          grep -q 'verified=2 planned=2' <<<"$healthy_output"

          receipt_count="$(
            find "$receipt_directory" \
              -maxdepth 1 \
              -type f \
              -name '*.local.deep-integrity.txt' |
            wc -l |
            tr -d '[:space:]'
          )"
          test "$receipt_count" -eq 2

          older_base="bitcoin-node-pruned-200-${yesterday}"
          older_archive="${backup_directory}/${older_base}.tar.zst"

          printf 'intentional checksum corruption\n' >>"$older_archive"

          set +e
          checksum_failure_output="$(
            scripts/macos-bitcoin-node-backup-deep-audit.sh \
              --local-directory "$backup_directory" \
              --external-directory "$external_directory" \
              --receipt-directory "$receipt_directory"
          )"
          checksum_failure_status=$?
          set -e

          printf '%s\n' "$checksum_failure_output"
          test "$checksum_failure_status" -eq 2
          grep -q 'SHA-256 mismatch' <<<"$checksum_failure_output"
          grep -q '\[SUMMARY\] status=CRITICAL' \
            <<<"$checksum_failure_output"

          printf 'not a valid Zstandard archive\n' >"$older_archive"

          (
            cd "$backup_directory"
            shasum -a 256 "${older_base}.tar.zst" \
              >"${older_base}.tar.zst.sha256"
          )

          chmod 600 \
            "$older_archive" \
            "${older_archive}.sha256"

          set +e
          zstd_failure_output="$(
            scripts/macos-bitcoin-node-backup-deep-audit.sh \
              --local-directory "$backup_directory" \
              --external-directory "$external_directory" \
              --receipt-directory "$receipt_directory"
          )"
          zstd_failure_status=$?
          set -e

          printf '%s\n' "$zstd_failure_output"
          test "$zstd_failure_status" -eq 2
          grep -q 'Zstandard integrity test failed' \
            <<<"$zstd_failure_output"
          grep -q '\[SUMMARY\] status=CRITICAL' \
            <<<"$zstd_failure_output"

      - name: Test backup freshness audit
        shell: bash
        run: |
          set -euo pipefail

          audit_root="$(
            mktemp -d "${TMPDIR:-/tmp}/bitcoin-backup-audit-ci.XXXXXX"
          )"
          audit_directory="${audit_root}/backups"
          external_directory="${audit_root}/external-volume/bitcoin-node-backups"

          cleanup() {
            rm -rf "$audit_root"
          }
          trap cleanup EXIT

          mkdir -p "$audit_directory"

          today="$(date -u '+%Y-%m-%d')"
          yesterday="$(date -u -v-1d '+%Y-%m-%d')"

          for backup_specification in \
            "300:${today}" \
            "200:${yesterday}"
          do
            block_height="${backup_specification%%:*}"
            backup_date="${backup_specification#*:}"
            backup_base="bitcoin-node-pruned-${block_height}-${backup_date}"
            archive_path="${audit_directory}/${backup_base}.tar.zst"
            checksum_path="${archive_path}.sha256"
            manifest_path="${audit_directory}/${backup_base}.manifest.txt"

            printf 'test archive\n' >"$archive_path"
            printf '%064d  %s\n' \
              0 \
              "${backup_base}.tar.zst" \
              >"$checksum_path"
            printf 'block_height=%s\nbackup_date=%s\n' \
              "$block_height" \
              "$backup_date" \
              >"$manifest_path"

            chmod 600 \
              "$archive_path" \
              "$checksum_path" \
              "$manifest_path"
          done

          healthy_output="$(
            scripts/macos-bitcoin-node-backup-audit.sh \
              --local-directory "$audit_directory" \
              --external-directory "$external_directory" \
              --stale-days 7 \
              --critical-days 14 \
              --minimum-backups 2 \
              --warning-free-gib 1 \
              --critical-free-gib 0
          )"

          printf '%s\n' "$healthy_output"
          grep -q '\[SUMMARY\] status=HEALTHY' <<<"$healthy_output"

          set +e
          warning_output="$(
            scripts/macos-bitcoin-node-backup-audit.sh \
              --local-directory "$audit_directory" \
              --external-directory "$external_directory" \
              --stale-days 7 \
              --critical-days 14 \
              --minimum-backups 3 \
              --warning-free-gib 1 \
              --critical-free-gib 0
          )"
          warning_status=$?
          set -e

          printf '%s\n' "$warning_output"
          test "$warning_status" -eq 1
          grep -q '\[SUMMARY\] status=WARNING' <<<"$warning_output"

          set +e
          critical_output="$(
            scripts/macos-bitcoin-node-backup-audit.sh \
              --local-directory "${audit_root}/missing" \
              --external-directory "$external_directory" \
              --stale-days 7 \
              --critical-days 14 \
              --minimum-backups 2 \
              --warning-free-gib 1 \
              --critical-free-gib 0
          )"
          critical_status=$?
          set -e

          printf '%s\n' "$critical_output"
          test "$critical_status" -eq 2
          grep -q '\[SUMMARY\] status=CRITICAL' <<<"$critical_output"

      - name: Validate LaunchAgent plists
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint \
            launchd/com.pzhendov.bitcoin-node-backup-deep-notify.plist \
            launchd/com.pzhendov.bitcoin-node-backup-notify.plist \
            launchd/com.pzhendov.bitcoin-node-health-notify.plist
